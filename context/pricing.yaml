# ── Следствия для рекламы ───────────────────────────────────────

implications:
  - id: value_by_club
    text: >
      Первый платёж отличается по сети в 2.3 раза (799 в Білій Церкві →
      1849 в ARENA City). Значит value в CAPI должно быть функцией
      (клуб, тариф), а не константой. Единый LTV-множитель на сеть даст
      систематическую ошибку: дешёвые клубы переоценятся, дорогие недооценятся.

  - id: annual_vs_monthly
    text: >
      Годовой абонемент — 9 348–19 230 ₴, это 7–12 первых месячных платежей.
      Если в CAPI по годовым уходит та же логика, что по месячным, алгоритм
      не отличает годового клиента от месячного и не будет их искать.
      Годовые — самый ценный сегмент, их надо отделять в событии.

  - id: membership_fee
    text: >
      Членський внесок 1 199 ₴ на 42-й день почти удваивает первый платёж
      для месячных тарифов, но списывается позже и, скорее всего, не попадает
      в Purchase-событие. Проверить — это большой кусок недоучтённой ценности.

  - id: promo_deadline
    text: >
      Акция месячных заканчивается 31.07.2026, годовых — 30.07.2026.
      Дедлайн — рабочий рекламный аргумент (семейство концептов D),
      но цены надо переснять сразу после смены акции.

  - id: first_week_1uah
    text: >
      Первая неделя за 1 ₴ — сильный оффер с низким порогом входа,
      но он же источник «дешёвых» лидов. Конверсия заявка→продажа
      в разрезе креатива покажет, какие креативы приводят тех,
      кто остаётся после первой недели.
