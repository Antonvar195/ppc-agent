# pricing.yaml — цены по клубам Apollo Next
# Источник: apollo.online, снято 2026-07-29
# Все цены в UAH. Промо-цены действуют до 31.07.2026 (месячные) / 30.07.2026 (годовые).
#
# ВАЖНО: продажа идёт сразу по акционной цене. Регулярная цена показывается
# только как зачёркнутая. Для расчёта LTV использовать promo, не regular.
#
# Обновлять при смене акции. Проверять перед каждым месячным планированием.

